; Raise PHP's upload limits above the 2M default so staff can attach real
; receipts and shipment manifests (the UI/API promise files "under 4 MB").
; Attachments are base64-encoded and stored in the DB, so memory_limit must
; comfortably exceed the largest allowed upload. Vercel caps the request body
; at ~4.5 MB, so a 4 MB file is the practical ceiling regardless.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 128M
